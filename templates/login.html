<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MediSync</title>
    {% include 'pwa_head.html' %}
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema"><span data-theme-icon aria-hidden="true">☾</span></button>
    <div class="login-card">
        <div class="logo-icon" aria-label="Espacio reservado para el logo oficial">MS</div>
        <h1>MediSync</h1>
        <p class="subtitle">Plataforma Médica Inteligente</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="nombre@medisync.com" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button class="btn-login" id="login-submit" type="submit">Acceder al Sistema</button>
        </form>
        <button class="btn-sos" id="open-sos" type="button">🆘 SOS — Pedir ayuda</button>
        <button class="btn-scan" id="open-scan" type="button">📷 Escanear QR / Mi QR</button>
        <p id="resultado" role="status" aria-live="polite"></p>
    </div>

    <dialog id="sos-dialog" class="emergency-dialog">
        <div class="editor-heading"><div><p class="eyebrow">SIN INICIAR SESIÓN</p><h2>Pedir ayuda</h2></div><button class="icon-button" type="button" id="sos-close" aria-label="Cerrar">✕</button></div>
        <p>¿Para quién es la solicitud de ayuda?</p>
        <div class="sos-options">
            <button class="btn-action active" type="button" id="sos-self" data-sos-target="self">Para mí</button>
            <button class="btn-action" type="button" id="sos-other" data-sos-target="other">Para alguien más (sin seguro)</button>
        </div>
        <div id="sos-other-field" hidden>
            <label for="sos-other-name">Nombre de la persona</label>
            <input id="sos-other-name" autocomplete="off" placeholder="Nombre (opcional)">
        </div>
        <div class="editor-actions">
            <button class="btn-action" type="button" id="sos-send">Enviar ubicación y pedir ayuda</button>
            <button class="btn-action secondary" type="button" id="sos-cancel">Cancelar</button>
        </div>
        <p id="sos-status" role="status" aria-live="polite"></p>
    </dialog>

    <dialog id="emergency-dialog" class="emergency-dialog">
        <div class="editor-heading"><div><p class="eyebrow">SIN INICIAR SESIÓN</p><h2>Escanear código QR</h2></div><button class="icon-button" type="button" id="close-emergency-dialog" aria-label="Cerrar">✕</button></div>
        <p>Apunta la cámara al código QR de la tarjeta de asegurado.</p>
        <video id="emergency-video" playsinline autoplay muted></video>
        <p id="emergency-scan-status" role="status" aria-live="polite">Activando la cámara…</p>
    </dialog>

    <script id="firebase-config" type="application/json">{{ firebase_config|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/emergency-scanner.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/sos.js') }}"></script>

</body>
</html>
