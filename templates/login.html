<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MediSync</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema"><span data-theme-icon aria-hidden="true">☾</span></button>
    <div class="login-card">
        <div class="logo-icon" aria-label="Espacio reservado para el logo oficial">MS</div>
        <h1>MediSync</h1>
        <p class="subtitle">Plataforma Médica Inteligente</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="nombre@medisync.com" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button class="btn-login" id="login-submit" type="submit">Acceder al Sistema</button>
        </form>
        <p id="resultado" role="status" aria-live="polite"></p>
    </div>

    <script id="firebase-config" type="application/json">{{ firebase_config|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
