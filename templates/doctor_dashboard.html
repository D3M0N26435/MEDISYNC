<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Panel Médico</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <aside>
        <div class="brand"><span class="brand-logo" aria-label="Espacio reservado para el logo oficial">MS</span><span>MediSync</span></div>
        <ul class="nav-links">
            <li><a href="/doctor" class="active">🩺 Consultas & Recetas</a></li>
        </ul>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
    </aside>
    <main>
        <header>
            <h1>Panel del Médico</h1>
            <div class="header-actions"><span class="role-badge">MÉDICO</span><button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema"><span data-theme-icon aria-hidden="true">☾</span></button></div>
        </header>
        <div class="card">
            <h2>Gestión de Historiales y Recetas Médicas</h2>
            <div class="form-group">
                <label>Nombre o C.I. del Paciente</label>
                <input type="text" placeholder="Ej. Juan Pérez - C.I. 8392011">
            </div>
            <div class="form-group">
                <label>Prescripción y Medicamentos (Norma LINAME)</label>
                <textarea rows="3" placeholder="Indique medicamento, dosis y frecuencia..."></textarea>
            </div>
            <button class="btn-action" onclick="alert('Receta emitida con éxito')">Emitir Receta Digital</button>
        </div>
    </main>
    <script>function cerrarSesion() { window.location.href = "/"; }</script>
</body>
</html>
