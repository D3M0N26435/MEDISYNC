<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Panel Médico</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/clinical.css') }}">
</head>
<body>
    <aside>
        <div class="brand"><span class="brand-logo" aria-label="Espacio reservado para el logo oficial">MS</span><span>MediSync</span></div>
        <ul class="nav-links"><li><a href="/doctor" class="active">🩺 Mis consultas</a></li></ul>
        <button type="button" data-logout class="btn-logout">Cerrar Sesión</button>
    </aside>
    <main>
        <header>
            <h1>Panel del Médico</h1>
            <div class="header-actions"><span class="role-badge">MÉDICO</span><button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema"><span data-theme-icon aria-hidden="true">☾</span></button></div>
        </header>
        <section>
            <div class="clinical-heading"><div><p class="eyebrow">AGENDA</p><h2>Consultas reservadas</h2><p>Al registrar la atención, puedes guardar la nota clínica y emitir una receta.</p></div></div>
            <div id="doctor-feedback" class="clinical-feedback" role="status" aria-live="polite"></div>
            <div id="doctor-appointments" class="clinical-list"><p class="empty-state">Cargando consultas…</p></div>
        </section>
        <section id="record-editor" class="card clinical-editor" hidden>
            <div class="clinical-heading"><div><p class="eyebrow">ATENCIÓN</p><h2>Registrar consulta</h2><p id="record-appointment-summary"></p></div><button id="close-record-editor" type="button" class="icon-button" aria-label="Cerrar formulario">✕</button></div>
            <form id="record-form">
                <input id="record-appointment-id" type="hidden">
                <div class="clinical-form-grid">
                    <div class="form-group"><label for="record-diagnosis">Diagnóstico o motivo de atención</label><textarea id="record-diagnosis" rows="2" maxlength="1000" required></textarea></div>
                    <div class="form-group"><label for="record-notes">Nota clínica</label><textarea id="record-notes" rows="3" maxlength="4000" required></textarea></div>
                    <div class="form-group clinical-wide"><label for="record-treatment">Plan o indicaciones</label><textarea id="record-treatment" rows="3" maxlength="3000"></textarea></div>
                </div>
                <fieldset class="medicine-fieldset">
                    <legend>Receta (opcional)</legend>
                    <div id="prescription-items"></div>
                    <button id="add-prescription-item" class="btn-action secondary" type="button">＋ Añadir medicamento</button>
                    <div class="form-group expiry-field"><label for="prescription-expiry">Vigente hasta (opcional)</label><input id="prescription-expiry" type="date"></div>
                </fieldset>
                <div class="editor-actions"><button id="save-record" class="btn-action" type="submit">Guardar atención</button><button class="btn-action secondary" id="cancel-record" type="button">Cancelar</button></div>
            </form>
        </section>
    </main>
    <script id="firebase-config" type="application/json">{{ firebase_config|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/doctor.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/logout.js') }}"></script>
</body>
</html>
