<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Panel Farmacéutico</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/clinical.css') }}">
</head>
<body>
    <aside>
        <div class="brand"><span class="brand-logo" aria-label="Espacio reservado para el logo oficial">MS</span><span>MediSync</span></div>
        <ul class="nav-links"><li><a href="/pharmacist" class="active">💊 Solicitudes de receta</a></li></ul>
        <button type="button" data-logout class="btn-logout">Cerrar Sesión</button>
    </aside>
    <main>
        <header>
            <h1>Solicitudes de farmacia</h1>
            <div class="header-actions"><span class="role-badge">FARMACÉUTICO</span><button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema"><span data-theme-icon aria-hidden="true">☾</span></button></div>
        </header>
        <section>
            <div class="clinical-heading"><div><p class="eyebrow">RECOGIDA</p><h2>Recetas solicitadas en tu farmacia</h2><p id="pharmacy-location-label">Cargando sede…</p></div></div>
            <p id="pharmacist-feedback" class="clinical-feedback" role="status" aria-live="polite"></p>
            <div id="pharmacy-orders" class="clinical-list"><p class="empty-state">Cargando solicitudes…</p></div>
        </section>
    </main>
    <script id="firebase-config" type="application/json">{{ firebase_config|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/pharmacist.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/logout.js') }}"></script>
</body>
</html>
