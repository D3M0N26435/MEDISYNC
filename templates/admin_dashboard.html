<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Panel Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <aside>
        <div class="brand">🏥 MediSync</div>
        <ul class="nav-links">
            <li><a href="/admin" class="active">⚙️ Gestión de Personal</a></li>
        </ul>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
    </aside>
    <main>
        <header>
            <h1>Panel de Administración</h1>
            <span class="role-badge">ADMIN</span>
        </header>
        <div class="card">
            <h2>Gestión de Usuarios y Roles</h2>
            <div class="form-group">
                <label>Correo del Usuario</label>
                <input type="email" id="admin-email" placeholder="usuario@medisync.com">
            </div>
            <div class="form-group">
                <label>Asignar Rol</label>
                <select id="admin-estado">
                    <option value="doctor">Médico</option>
                    <option value="pharmacist">Farmacéutico</option>
                    <option value="patient">Paciente</option>
                </select>
            </div>
            <button class="btn-action" onclick="alert('Cambios guardados')">Guardar Cambios</button>
        </div>
    </main>
    <script>function cerrarSesion() { window.location.href = "/"; }</script>
</body>
</html>
