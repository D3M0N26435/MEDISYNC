<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync | Portal Médico</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; }
        nav { padding: 15px 25px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; padding: 25px 20px; border-radius: 8px; border: 1px solid #334155; text-align: center; text-decoration: none; color: #f8fafc; transition: transform 0.2s, border-color 0.2s; display: block; }
        .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
        .card-icon { font-size: 2rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <h2 style="margin:0; color:#38bdf8;">MediSync | Panel Médico</h2>
        <a href="../../index.html" style="color:#94a3b8; text-decoration:none;">&larr; Cambiar Rol</a>
    </nav>
    <div class="container">
        <h3>Bienvenido, Dr. Mendoza</h3>
        <p style="color:#94a3b8;">Gestión de pacientes y emision de prescripciones clínicas.</p>

        <div class="grid">
            <a href="atender.html" class="card">
                <span class="card-icon">📅</span>
                <h4>Atender Citas Agendadas</h4>
                <p style="color:#94a3b8; font-size:0.9rem;">Ver consultas solicitadas por los pacientes en tiempo real.</p>
            </a>
            <a href="prescribir.html" class="card">
                <span class="card-icon">📝</span>
                <h4>Emitir Receta Médica</h4>
                <p style="color:#94a3b8; font-size:0.9rem;">Generar orden de medicamentos digitales para farmacia.</p>
            </a>
        </div>
    </div>
</body>
</html>
