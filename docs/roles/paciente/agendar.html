<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta | MediSync</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        select, input[type="date"], input[type="time"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 1rem;
        }
        .btn-submit {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .success-msg {
            display: none;
            background-color: #064e3b;
            border: 1px solid #10b981;
            color: #a7f3d0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html">&larr; Volver al Panel de Paciente</a>
        <h2>Agendar Consulta Médica</h2>

        <div id="successMsg" class="success-msg">
            ✓ ¡Cita agendada con éxito! Podrás revisarla en tu Historial.
        </div>

        <form id="appointmentForm" onsubmit="saveAppointment(event)">
            <div class="form-group">
                <label for="specialty">Especialidad:</label>
                <select id="specialty" required onchange="loadDoctors()">
                    <option value="">-- Selecciona Especialidad --</option>
                    <option value="Medicina General">Medicina General</option>
                    <option value="Pediatría">Pediatría</option>
                    <option value="Cardiología">Cardiología</option>
                    <option value="Traumatología">Traumatología</option>
                </select>
            </div>

            <div class="form-group">
                <label for="doctor">Médico Disponible:</label>
                <select id="doctor" required>
                    <option value="">-- Selecciona Primero Especialidad --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Fecha de la Cita:</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="time">Horario Disponibilidad:</label>
                <input type="time" id="time" required>
            </div>

            <button type="submit" class="btn-submit">Confirmar Cita</button>
        </form>
    </div>

    <script>
        const doctorsData = {
            "Medicina General": ["Dr. Carlos Mendoza", "Dra. Ana Ramos"],
            "Pediatría": ["Dra. Elena Gómez"],
            "Cardiología": ["Dr. Roberto Torrez"],
            "Traumatología": ["Dr. Mario Aguilar"]
        };

        function loadDoctors() {
            const specialty = document.getElementById('specialty').value;
            const doctorSelect = document.getElementById('doctor');
            doctorSelect.innerHTML = '<option value="">-- Selecciona Médico --</option>';

            if (specialty && doctorsData[specialty]) {
                doctorsData[specialty].forEach(doc => {
                    const opt = document.createElement('option');
                    opt.value = doc;
                    opt.textContent = doc;
                    doctorSelect.appendChild(opt);
                });
            }
        }

        function saveAppointment(e) {
            e.preventDefault();
            const appointment = {
                specialty: document.getElementById('specialty').value,
                doctor: document.getElementById('doctor').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                created: new Date().toISOString()
            };

            let current = JSON.parse(localStorage.getItem('appointments') || '[]');
            current.push(appointment);
            localStorage.setItem('appointments', JSON.stringify(current));

            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('appointmentForm').reset();
        }
    </script>
</body>
</html>
