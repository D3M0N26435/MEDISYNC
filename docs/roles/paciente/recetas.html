<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas y Farmacias | MediSync</title>
    <link rel="stylesheet" href="../../css/style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <a href="index.html">&larr; Volver al Panel</a>
        <h2>Recetas y Puntos de Dispensación</h2>
        
        <div id="map" style="height: 400px; border-radius: 8px; margin-top: 15px;"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar Mapa centrado
        const map = L.map('map').setView([-17.9647, -67.1060], 13); // Ejemplo Oruro

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Ejemplo de marcador de farmacia disponible
        L.marker([-17.9647, -67.1060]).addTo(map)
            .bindPopup('<b>Farmacia Central</b><br>Stock: Paracetamol, Ibuprofeno.<br>Dirección: Av. 6 de Octubre')
            .openPopup();
    </script>
</body>
</html>
