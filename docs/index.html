<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Selección de Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; text-align: center; }
        .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e293b; padding: 30px 20px; border-radius: 12px; text-decoration: none; color: #f8fafc; font-weight: bold; border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s; display: block; }
        .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .card-icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #38bdf8;">MediSync</h1>
        <p>Selecciona la interfaz según tu rol de acceso:</p>
        
        <div class="role-grid">
            <a href="roles/paciente/index.html" class="card">
                <span class="card-icon">🩺</span>
                Portal Paciente
            </a>
            <a href="roles/medico/index.html" class="card">
                <span class="card-icon">👨‍⚕️</span>
                Portal Médico
            </a>
            <a href="roles/farmaceutico/index.html" class="card">
                <span class="card-icon">💊</span>
                Portal Farmacéutico
            </a>
            <a href="roles/admin/index.html" class="card">
                <span class="card-icon">⚙️</span>
                Portal Administrador
            </a>
        </div>
    </div>
</body>
</html>
